<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Buying</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body { font-family: Arial; padding:15px; background:#f5f5f5; }
h2 { text-align:center; }

button {
    padding:10px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:#007bff;
    color:white;
}

.name-btn { background:#28a745; width:100%; }

table {
    width:100%;
    background:white;
    border-collapse:collapse;
}

td, th {
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.amount-input {
    width:100%;
    border:none;
    text-align:center;
    font-size:16px;
}
</style>
</head>

<body>

<div id="captureArea">

<h2>Poker Buying</h2>

<button onclick="login()">🔐 Login</button>
<button onclick="logout()">🚪 Logout</button>
<button onclick="undo()">↩️ Undo</button>
<button onclick="resetAll()">🗑️ Reset</button>
<button onclick="closing()">🏁 Closing</button>
<button onclick="saveGame()">💾 Save Game</button>
<button onclick="showStats()">📊 Stats</button>
<button onclick="showLeaderboard()">🏆 Leaderboard</button>
<button onclick="showMonthlyStats()">📅 Monthly Stats</button>
<button onclick="showYearlyStats()">📆 Yearly Stats</button>

<div id="expenseBox" style="display:none; margin-top:10px;">
    Expense:
    <input type="number" id="expenseInput" value="18500">
</div>

<br>

Increment:
<input type="number" id="inc" value="10000">

<table>
<tr id="headerRow">
<th>Name</th>
<th>Amount</th>
</tr>
<tbody id="table"></tbody>
</table>

<script>

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyB3I2-lTMIEUfQsSjd8Q0EuM2YgFYfoOpc",
  authDomain: "poker-score-live.firebaseapp.com",
  databaseURL: "https://poker-score-live-default-rtdb.firebaseio.com",
  projectId: "poker-score-live",
  storageBucket: "poker-score-live.appspot.com",
  messagingSenderId: "673641455612",
  appId: "1:673641455612:web:560424d0ac779f95a05c79"
};

firebase.initializeApp(firebaseConfig);

let auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
let db = firebase.database();

let role = "viewer";
let userEmail = null;

let names = ["Fahad","Adeel","Salman","Haris","Hassan","Bilal","Saad lawai","Junaid","Waleed","Naveed","Ahad","Mujeeb","Haris A","Bilal Gül","Y","Z"];

let data = new Array(names.length).fill(0);

// ✅ HISTORY FOR UNDO
let history = [];
let closingMode = false;
let chipCounts = new Array(names.length).fill(0);

// 🔐 LOGIN
function login() {
    let email = prompt("Email:");
    let password = prompt("Password:");

    auth.signInWithEmailAndPassword(email, password)
    .then(user => {
        userEmail = email;

        let key = email.replace(/[@.]/g, "_");

        // 🔥 FIRST get role
        db.ref("roles/" + key).once("value")
        .then(snap => {
            role = snap.val() || "viewer";

            alert("Logged in as: " + role);

            // 🔥 THEN load data (VERY IMPORTANT)
            listenData();
        });
    })
    .catch(err => {
        alert("Login failed: " + err.message);
        console.log(err);
    });
}

auth.onAuthStateChanged(user => {
    if (user) {

        userEmail = user.email.toLowerCase();

        let key = userEmail.replace(/[@.]/g, "_");

        db.ref("roles/" + key).once("value")
        .then(snap => {

            role = snap.val() || "viewer";

            listenData();
            update();
        });
    }
});

// 🚪 LOGOUT
function logout() {
    auth.signOut();
    location.reload();
}

// 🚪 Sound
function playChipSound() {
    let audio = new Audio("https://actions.google.com/sounds/v1/money/coins_dropping.ogg");
    audio.play();
}

function speakTotalUrdu(name, total) {

    let text = name + " total " + total ;

    let msg = new SpeechSynthesisUtterance(text);

    msg.lang = "en-US";
    msg.rate = 0.95;
    msg.pitch = 1.4; // sweeter female tone

    let voices = window.speechSynthesis.getVoices();

    // try to select female voice
    let femaleVoice =
        voices.find(v => v.name.toLowerCase().includes("female")) ||
        voices.find(v => v.name.toLowerCase().includes("zira")) ||
        voices.find(v => v.name.toLowerCase().includes("samantha")) ||
        voices.find(v => v.name.toLowerCase().includes("google us english")) ||
        voices[0];

    if (femaleVoice) {
        msg.voice = femaleVoice;
    }

    window.speechSynthesis.speak(msg);
}


// Calculate Loss

function mround(value, multiple) {
    return Math.round(value / multiple) * multiple;
}

function calculateLoss(i) {
    let expense = parseInt(document.getElementById("expenseInput")?.value || 18500) || 0;

    let totalBuying = data.reduce((a, b) => a + (b || 0), 0);
    let totalChips = chipCounts.reduce((a, b) => a + (b || 0), 0);

    if (totalChips === 0) return 0;

    let expenseRatio = expense / totalChips;

    let payable = [];
    let baseLoss = [];

    for (let x = 0; x < names.length; x++) {
        let buying = data[x] || 0;
        let chips = chipCounts[x] || 0;

        let afterDeduction = chips * (1 - expenseRatio);

        payable[x] = mround(Math.max(0, Math.min(buying, afterDeduction)), 100);
        baseLoss[x] = buying - payable[x];
    }

    let totalPayable = payable.reduce((a, b) => a + b, 0);
    let totalBaseLoss = baseLoss.reduce((a, b) => a + b, 0);

    if (totalBaseLoss === 0) return 0;

    let remainingPool = totalBuying - totalPayable - expense;

    let lossDistribution = mround(remainingPool * (baseLoss[i] / totalBaseLoss), 100);

    let finalPayable = payable[i] + lossDistribution;

    let dayLoss = (data[i] || 0) - finalPayable;

    return Math.round(dayLoss);
}

function saveGame() {
    if (role !== "admin") {
        alert("Only admin can save game");
        return;
    }

    if (!closingMode) {
        alert("Please press Closing first");
        return;
    }

    if (!confirm("Are you sure you want to save and close today's game?")) return;

    let today = new Date().toISOString().split("T")[0];
    let expense = parseInt(document.getElementById("expenseInput")?.value || 0) || 0;

    let gameData = {
        date: today,
        expense: expense,
        players: {}
    };

    names.forEach((name, i) => {
        gameData.players[name] = {
            buying: data[i] || 0,
            chipCount: chipCounts[i] || 0,
            loss: calculateLoss(i)
        };
    });

    // saves only one file per day. If saved again, it replaces same date.
    db.ref("games/" + today).set(gameData).then(() => {
        downloadScreenshot(today);

        data = new Array(names.length).fill(0);
        chipCounts = new Array(names.length).fill(0);
        closingMode = false;

        document.getElementById("expenseBox").style.display = "none";

        save();
        update();

        alert("Game saved as " + today);
    });
}

function downloadScreenshot(fileName) {

    let area = document.getElementById("captureArea");

    // temporary styling for screenshot fit
    let oldWidth = area.style.width;
    let oldTransform = area.style.transform;
    let oldBackground = document.body.style.background;

    document.body.style.background = "white";

    area.style.width = "900px";
    area.style.transform = "scale(1)";
    area.style.transformOrigin = "top left";

    html2canvas(area, {
        scale: 2,
        useCORS: true
    }).then(canvas => {

        let link = document.createElement("a");
        link.download = fileName + ".png";
        link.href = canvas.toDataURL("image/png");
        link.click();

        // restore styles
        area.style.width = oldWidth;
        area.style.transform = oldTransform;
        document.body.style.background = oldBackground;
    });
}

function showStats() {

    Promise.all([
        db.ref("yearlyStats").once("value"),
        db.ref("games").once("value")
    ]).then(([yearSnap, gameSnap]) => {

        let yearly = yearSnap.val() || {};
        let games = gameSnap.val() || {};

        let stats = {};

        // 🔥 HISTORICAL YEARLY DATA
        Object.keys(yearly).forEach(year => {

            Object.keys(yearly[year]).forEach(name => {

                let loss = yearly[year][name] || 0;

                if (!stats[name]) {
                    stats[name] = {
                        years: 0,
                        totalLoss: 0,
                        highestLoss: 0
                    };
                }

                stats[name].years += 1;
                stats[name].totalLoss += loss;
                stats[name].highestLoss = Math.max(stats[name].highestLoss, loss);
            });
        });

        // 🔥 NEW SAVED GAMES
        Object.keys(games).forEach(date => {

            let players = games[date].players || {};

            Object.keys(players).forEach(name => {

                let loss = players[name].loss || 0;

                if (!stats[name]) {
                    stats[name] = {
                        years: 0,
                        totalLoss: 0,
                        highestLoss: 0
                    };
                }

                stats[name].totalLoss += loss;
                stats[name].highestLoss = Math.max(stats[name].highestLoss, loss);
            });
        });

        let text = "PLAYER STATS\n\n";

        Object.keys(stats).forEach(name => {

            let s = stats[name];

            text += name + "\n";
            text += "Years Tracked: " + s.years + "\n";
            text += "All Time Loss: " + s.totalLoss.toLocaleString() + "\n";
            text += "Highest Annual Loss: " + s.highestLoss.toLocaleString() + "\n\n";
        });

        alert(text);

    });
}

function showLeaderboard() {
    db.ref("stats").once("value").then(snap => {
        let stats = snap.val();

        if (!stats) {
            alert("No stats saved yet");
            return;
        }

        let list = Object.keys(stats).map(name => ({
            name: name,
            totalLoss: stats[name].totalLoss || 0
        }));

        list.sort((a, b) => b.totalLoss - a.totalLoss);

        let text = "🏆 LOSS LEADERBOARD\n\n";

        list.forEach((p, index) => {
            text += (index + 1) + ". " + p.name + " - " + p.totalLoss.toLocaleString() + "\n";
        });

        alert(text);
    });
}

function showMonthlyStats() {
    let month = prompt("Enter month in format YYYY-MM, example: 2026-05");
    if (!month) return;

    db.ref("games").once("value").then(snap => {
        let games = snap.val();

        if (!games) {
            alert("No games saved yet");
            return;
        }

        let monthly = {};

        Object.keys(games).forEach(date => {
            if (!date.startsWith(month)) return;

            let players = games[date].players || {};

            Object.keys(players).forEach(name => {
                if (!monthly[name]) {
                    monthly[name] = {
                        games: 0,
                        totalLoss: 0,
                        highestLoss: 0
                    };
                }

                let loss = players[name].loss || 0;

                monthly[name].games += 1;
                monthly[name].totalLoss += loss;
                monthly[name].highestLoss = Math.max(monthly[name].highestLoss, loss);
            });
        });

        let text = "📅 MONTHLY STATS " + month + "\n\n";

        Object.keys(monthly).forEach(name => {
            let s = monthly[name];
            let avg = Math.round(s.totalLoss / s.games);

            text += name + "\n";
            text += "Games: " + s.games + "\n";
            text += "Total Loss: " + s.totalLoss.toLocaleString() + "\n";
            text += "Average Loss: " + avg.toLocaleString() + "\n";
            text += "Highest Loss: " + s.highestLoss.toLocaleString() + "\n\n";
        });

        alert(text);
    });
}

function showYearlyStats() {
    let year = prompt("Enter year, example: 2026");
    if (!year) return;

    db.ref("games").once("value").then(snap => {
        let games = snap.val();

        if (!games) {
            alert("No games saved yet");
            return;
        }

        let yearly = {};

        Object.keys(games).forEach(date => {
            if (!date.startsWith(year)) return;

            let players = games[date].players || {};

            Object.keys(players).forEach(name => {
                if (!yearly[name]) {
                    yearly[name] = {
                        games: 0,
                        totalLoss: 0,
                        highestLoss: 0
                    };
                }

                let loss = players[name].loss || 0;

                yearly[name].games += 1;
                yearly[name].totalLoss += loss;
                yearly[name].highestLoss = Math.max(yearly[name].highestLoss, loss);
            });
        });

        let text = "📆 YEARLY STATS " + year + "\n\n";

        Object.keys(yearly).forEach(name => {
            let s = yearly[name];
            let avg = Math.round(s.totalLoss / s.games);

            text += name + "\n";
            text += "Games: " + s.games + "\n";
            text += "Total Loss: " + s.totalLoss.toLocaleString() + "\n";
            text += "Average Loss: " + avg.toLocaleString() + "\n";
            text += "Highest Loss: " + s.highestLoss.toLocaleString() + "\n\n";
        });

        alert(text);
    });
}

// ☁️ REAL TIME DATA
function listenData() {
    db.ref("data").on("value", snap => {
        if (snap.exists()) {
            data = snap.val();
        }
        update();
    });
}

// 💾 SAVE (admin only)
function save() {
    if (role !== "admin") return;
    db.ref("data").set(data);
}

// ↩️ UNDO
function undo() {
    if (role !== "admin") {
        alert("Only admin can undo");
        return;
    }

    if (history.length === 0) return;

    data = history.pop();
    save();
    update();
}

// 🗑️ RESET
function resetAll() {
    if (role !== "admin") {
        alert("Only admin can reset data");
        return;
    }

    if (!confirm("Reset all values?")) return;

    history.push([...data]);
    data = new Array(names.length).fill(0);

    save();
    update();
}

function closing() {
    if (role !== "admin") {
        alert("Only admin can close");
        return;
    }

    closingMode = true;
    document.getElementById("expenseBox").style.display = "block";
    update();
}



// 🖥 UPDATE UI
function update() {
let headerRow = document.getElementById("headerRow");

headerRow.innerHTML = "<th>Name</th><th>Amount</th>";

if (closingMode) {
    headerRow.innerHTML += "<th>Chip Count</th><th>Loss</th>";
}    
let tbody = document.getElementById("table");
    tbody.innerHTML = "";

    let total = 0;
let totalChips = 0;
let totalLoss = 0;

    names.forEach((n, i) => {
        let row = document.createElement("tr");

        // BUTTON
        let btn = document.createElement("button");
        btn.innerText = n;
        btn.className = "name-btn";
        btn.disabled = (role !== "admin");

        btn.onclick = () => {
            if (role !== "admin") return;

            history.push([...data]);

            let inc = parseInt(document.getElementById("inc").value) || 0;
          data[i] = (data[i] || 0) + inc;

	  playChipSound();
speakTotalUrdu(n, data[i]);

	  save();
	  update();
        };

        let td1 = document.createElement("td");
        td1.appendChild(btn);

        // INPUT
        let input = document.createElement("input");
        input.className = "amount-input";
        input.value = (data[i] || 0).toLocaleString();
        input.disabled = (role !== "admin");

        input.onfocus = () => {
            input.value = data[i] || 0;
        };

        input.onblur = () => {
            if (role !== "admin") return;

            history.push([...data]);

            data[i] = parseInt(input.value.replace(/,/g,"")) || 0;

            save();
            update();
        };

        let td2 = document.createElement("td");
        td2.appendChild(input);

        total += data[i] || 0;
if (closingMode) {
    totalChips += chipCounts[i] || 0;
    totalLoss += calculateLoss(i);
}

        row.appendChild(td1);
row.appendChild(td2);

// 🔥 ADD THIS BLOCK HERE
if (closingMode) {

    // Chip Count
    let chipInput = document.createElement("input");
    chipInput.value = chipCounts[i] || "";
    chipInput.disabled = (role !== "admin");

    chipInput.onblur = () => {
        chipCounts[i] = parseInt(chipInput.value) || 0;
        update();
    };

    let td3 = document.createElement("td");
    td3.appendChild(chipInput);

    // Loss (auto)
    let td4 = document.createElement("td");
    td4.innerText = calculateLoss(i).toLocaleString();

    row.appendChild(td3);
    row.appendChild(td4);
}

tbody.appendChild(row);

    });

// TOTAL ROW
let tr = document.createElement("tr");

let td1 = document.createElement("td");
td1.innerText = "TOTAL";
td1.style.fontWeight = "bold";

let td2 = document.createElement("td");
td2.innerText = total.toLocaleString();
td2.style.fontWeight = "bold";

tr.appendChild(td1);
tr.appendChild(td2);

if (closingMode) {
    let td3 = document.createElement("td");
    td3.innerText = totalChips.toLocaleString();
    td3.style.fontWeight = "bold";

    let td4 = document.createElement("td");
    td4.innerText = totalLoss.toLocaleString();
    td4.style.fontWeight = "bold";

    tr.appendChild(td3);
    tr.appendChild(td4);
}

tbody.appendChild(tr);
}

</script>
</div>
</body>
</html>
