<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection App</title>
    <link rel="manifest" href="manifest.json">

    <style>
        body { font-family: Arial; background:#f5f5f5; padding:15px; }
        h2 { text-align:center; }

        input, select {
            padding:8px; margin:5px;
        }

        button {
            padding:10px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            background:#007bff;
            color:white;
        }

        .name-btn { background:#28a745; width:100%; }
        .reset { background:#dc3545; }

        table {
            width:100%;
            background:white;
            border-collapse:collapse;
            margin-top:10px;
        }

        td, th {
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }
    </style>
</head>

<body>

<h2>💰 Collection App</h2>

<div>
    User:
    <select id="userSelect"></select>

    Increment:
    <input type="number" id="inc" value="5000">

    <button onclick="addUser()">+ User</button>
</div>

<button onclick="exportCSV()">📤 Export</button>
<button class="reset" onclick="resetAll()">Reset All</button>

<table>
<tr>
<th>Name</th>
<th>Amount</th>
</tr>
<tbody id="table"></tbody>
</table>

<script>
let names = ["Ali","Ahmed","Usman","Bilal","Hassan","Hussain","Saad","Zain","Omar","Hamza"];

let data = JSON.parse(localStorage.getItem("data")) || {};

let currentUser = localStorage.getItem("currentUser") || "Default";

if (!data[currentUser]) data[currentUser] = new Array(10).fill(0);

function save() {
    localStorage.setItem("data", JSON.stringify(data));
    localStorage.setItem("currentUser", currentUser);
}

function loadUsers() {
    let select = document.getElementById("userSelect");
    select.innerHTML = "";

    Object.keys(data).forEach(user => {
        let opt = document.createElement("option");
        opt.value = user;
        opt.text = user;
        if (user === currentUser) opt.selected = true;
        select.appendChild(opt);
    });

    select.onchange = () => {
        currentUser = select.value;
        update();
    };
}

function addUser() {
    let name = prompt("Enter user name:");
    if (!name) return;

    data[name] = new Array(10).fill(0);
    currentUser = name;
    save();
    loadUsers();
    update();
}

function update() {
    let tbody = document.getElementById("table");
    tbody.innerHTML = "";

    names.forEach((n, i) => {
        let row = document.createElement("tr");

        let btn = document.createElement("button");
        btn.innerText = n;
        btn.className = "name-btn";

        btn.onclick = () => {
            let inc = parseInt(document.getElementById("inc").value) || 0;
            data[currentUser][i] += inc;
            save();
            update();
        };

        let td1 = document.createElement("td");
        td1.appendChild(btn);

        let td2 = document.createElement("td");
        td2.innerText = data[currentUser][i];

        row.appendChild(td1);
        row.appendChild(td2);

        tbody.appendChild(row);
    });
}

function resetAll() {
    if (confirm("Reset all?")) {
        data[currentUser] = new Array(10).fill(0);
        save();
        update();
    }
}

function exportCSV() {
    let csv = "Name,Amount\n";

    names.forEach((n, i) => {
        csv += `${n},${data[currentUser][i]}\n`;
    });

    let blob = new Blob([csv], { type: 'text/csv' });
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentUser + ".csv";
    a.click();
}

loadUsers();
update();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
