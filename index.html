<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Buying</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body { font-family: Arial; padding:15px; background:#f5f5f5; }
h2 { text-align:center; }

button {
    padding:10px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:#007bff;
    color:white;
}

.name-btn { background:#28a745; width:100%; }

table {
    width:100%;
    background:white;
    border-collapse:collapse;
}

td, th {
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.amount-input {
    width:100%;
    border:none;
    text-align:center;
    font-size:16px;
}
</style>
</head>

<body>

<h2>Poker Buying</h2>

<button onclick="login()">🔐 Login</button>
<button onclick="logout()">🚪 Logout</button>
<button onclick="undo()">↩️ Undo</button>
<button onclick="resetAll()">🗑️ Reset</button>

<br>

Increment:
<input type="number" id="inc" value="5000">

<table>
<tr>
<th>Name</th>
<th>Amount</th>
</tr>
<tbody id="table"></tbody>
</table>

<script>

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyB3I2-lTMIEUfQsSjd8Q0EuM2YgFYfoOpc",
  authDomain: "poker-score-live.firebaseapp.com",
  databaseURL: "https://poker-score-live-default-rtdb.firebaseio.com",
  projectId: "poker-score-live",
  storageBucket: "poker-score-live.appspot.com",
  messagingSenderId: "673641455612",
  appId: "1:673641455612:web:560424d0ac779f95a05c79"
};

firebase.initializeApp(firebaseConfig);

let auth = firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
let db = firebase.database();

let role = "viewer";
let userEmail = null;

let names = ["Fahad","Adeel","Salman","Haris","Hassan","Bilal","Saad lawai","Junaid","Waleed","Naveed","Ahad","Mujeeb","Haris.A","Bilal Gül","Y","Z"];

let data = new Array(names.length).fill(0);

// ✅ HISTORY FOR UNDO
let history = [];

// 🔐 LOGIN
function login() {
    let email = prompt("Email:");
    let password = prompt("Password:");

    auth.signInWithEmailAndPassword(email, password)
    .then(user => {
        userEmail = email;

        let key = email.replace(/[@.]/g, "_");

        // 🔥 FIRST get role
        db.ref("roles/" + key).once("value")
        .then(snap => {
            role = snap.val() || "viewer";

            alert("Logged in as: " + role);

            // 🔥 THEN load data (VERY IMPORTANT)
            listenData();
        });
    })
    .catch(err => {
        alert("Login failed: " + err.message);
        console.log(err);
    });
}

// 🚪 LOGOUT
function logout() {
    auth.signOut();
    location.reload();
}

// 🚪 Sound
function playChipSound() {
    let audio = new Audio("https://actions.google.com/sounds/v1/money/coins_dropping.ogg");
    audio.play();
}

function speakTotalUrdu(name, total) {
    let msg = new SpeechSynthesisUtterance(name +  total);
    
    // Urdu / Hindi style voice if available
    msg.lang = "ur-PK";
    msg.rate = 0.9;
    msg.pitch = 1;

    window.speechSynthesis.speak(msg);
}

// ☁️ REAL TIME DATA
function listenData() {
    db.ref("data").on("value", snap => {
        if (snap.exists()) {
            data = snap.val();
        }
        update();
    });
}

// 💾 SAVE (admin only)
function save() {
    if (role !== "admin") return;
    db.ref("data").set(data);
}

// ↩️ UNDO
function undo() {
    if (role !== "admin") {
        alert("Only admin can undo");
        return;
    }

    if (history.length === 0) return;

    data = history.pop();
    save();
    update();
}

// 🗑️ RESET
function resetAll() {
    if (role !== "admin") {
        alert("Only admin can reset data");
        return;
    }

    if (!confirm("Reset all values?")) return;

    history.push([...data]);
    data = new Array(names.length).fill(0);

    save();
    update();
}

// 🖥 UPDATE UI
function update() {
    let tbody = document.getElementById("table");
    tbody.innerHTML = "";

    let total = 0;

    names.forEach((n, i) => {
        let row = document.createElement("tr");

        // BUTTON
        let btn = document.createElement("button");
        btn.innerText = n;
        btn.className = "name-btn";
        btn.disabled = (role !== "admin");

        btn.onclick = () => {
            if (role !== "admin") return;

            history.push([...data]);

            let inc = parseInt(document.getElementById("inc").value) || 0;
            data[i] = (data[i] || 0) + inc;

// chip sound + voice
playChipSound();
speakTotalUrdu(n, data[i]);

save();
update();
        };

        let td1 = document.createElement("td");
        td1.appendChild(btn);

        // INPUT
        let input = document.createElement("input");
        input.className = "amount-input";
        input.value = (data[i] || 0).toLocaleString();
        input.disabled = (role !== "admin");

        input.onfocus = () => {
            input.value = data[i] || 0;
        };

        input.onblur = () => {
            if (role !== "admin") return;

            history.push([...data]);

            data[i] = parseInt(input.value.replace(/,/g,"")) || 0;

            save();
            update();
        };

        let td2 = document.createElement("td");
        td2.appendChild(input);

        total += data[i] || 0;

        row.appendChild(td1);
        row.appendChild(td2);

        tbody.appendChild(row);
    });

    // TOTAL ROW
    let tr = document.createElement("tr");

    let td1 = document.createElement("td");
    td1.innerText = "TOTAL";
    td1.style.fontWeight = "bold";

    let td2 = document.createElement("td");
    td2.innerText = total.toLocaleString();
    td2.style.fontWeight = "bold";

    tr.appendChild(td1);
    tr.appendChild(td2);

    tbody.appendChild(tr);
}

</script>

</body>
</html>
