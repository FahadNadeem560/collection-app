<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection App</title>

<style>
body { font-family: Arial; background:#f5f5f5; padding:15px; }
h2 { text-align:center; }

input, select {
    padding:8px; margin:5px;
}

button {
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:#007bff;
    color:white;
}

.name-btn { background:#28a745; width:100%; }
.reset { background:#dc3545; }

table {
    width:100%;
    background:white;
    border-collapse:collapse;
    margin-top:10px;
}

td, th {
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.amount-input {
    width:100%;
    border:none;
    text-align:center;
    font-size:16px;
}
</style>
</head>

<body>

<h2>💰 Collection App</h2>

<div>
User:
<select id="userSelect"></select>

Increment:
<input type="number" id="inc" value="5000">

<button onclick="addUser()">+ User</button>
</div>

<button onclick="exportCSV()">📤 Export</button>
<button class="reset" onclick="resetAll()">Reset</button>
<button onclick="undo()">↩️ Undo</button>

<table>
<tr>
<th>Name</th>
<th>Amount</th>
</tr>
<tbody id="table"></tbody>
</table>

<script>
// 👇 CHANGE NAMES HERE
let names = ["Fahad","Adeel","Salman","Haris","Hassan","Bilal.K","Saad Lawai","Junaid","Waleed","Naveed","Ahad","Naveed","Mujeeb","Haris.A","Bilal.G","X","Y"];

// 👇 DATA
let data = JSON.parse(localStorage.getItem("data")) || {};
let currentUser = localStorage.getItem("currentUser") || "Default";

// 👇 UNDO
let history = [];

if (!data[currentUser]) data[currentUser] = new Array(names.length).fill(0);

// SAVE
function save() {
    localStorage.setItem("data", JSON.stringify(data));
    localStorage.setItem("currentUser", currentUser);
}

// LOAD USERS
function loadUsers() {
    let select = document.getElementById("userSelect");
    select.innerHTML = "";

    Object.keys(data).forEach(user => {
        let opt = document.createElement("option");
        opt.value = user;
        opt.text = user;
        if (user === currentUser) opt.selected = true;
        select.appendChild(opt);
    });

    select.onchange = () => {
        currentUser = select.value;
        if (!data[currentUser]) {
            data[currentUser] = new Array(names.length).fill(0);
        }
        update();
    };
}

// ADD USER
function addUser() {
    let name = prompt("Enter user name:");
    if (!name) return;

    data[name] = new Array(names.length).fill(0);
    currentUser = name;

    save();
    loadUsers();
    update();
}

// UPDATE TABLE
function update() {
    let tbody = document.getElementById("table");
    tbody.innerHTML = "";

    let total = 0;

    names.forEach((n, i) => {
        let row = document.createElement("tr");

        // BUTTON
        let btn = document.createElement("button");
        btn.innerText = n;
        btn.className = "name-btn";

        btn.onclick = () => {
            let inc = parseInt(document.getElementById("inc").value) || 0;

            history.push([...data[currentUser]]);

            data[currentUser][i] += inc;

            save();
            update();
        };

        let td1 = document.createElement("td");
        td1.appendChild(btn);

        // EDITABLE INPUT
        let input = document.createElement("input");
        input.type = "text";
        input.className = "amount-input";
        input.value = data[currentUser][i].toLocaleString();

        input.onfocus = () => {
            input.value = data[currentUser][i]; // remove commas for editing
        };

        input.onblur = () => {
            let val = parseInt(input.value.replace(/,/g, "")) || 0;

            history.push([...data[currentUser]]);

            data[currentUser][i] = val;

            save();
            update();
        };

        let td2 = document.createElement("td");
        td2.appendChild(input);

        total += data[currentUser][i];

        row.appendChild(td1);
        row.appendChild(td2);

        tbody.appendChild(row);
    });

    // TOTAL ROW
    let totalRow = document.createElement("tr");

    let td1 = document.createElement("td");
    td1.innerText = "TOTAL";
    td1.style.fontWeight = "bold";

    let td2 = document.createElement("td");
    td2.innerText = total.toLocaleString();
    td2.style.fontWeight = "bold";

    totalRow.appendChild(td1);
    totalRow.appendChild(td2);

    tbody.appendChild(totalRow);
}

// RESET
function resetAll() {
    if (confirm("Reset all values?")) {
        history.push([...data[currentUser]]);
        data[currentUser] = new Array(names.length).fill(0);
        save();
        update();
    }
}

// UNDO
function undo() {
    if (history.length === 0) return;

    data[currentUser] = history.pop();
    save();
    update();
}

// EXPORT
function exportCSV() {
    let csv = "Name,Amount\n";

    names.forEach((n, i) => {
        csv += `${n},${data[currentUser][i]}\n`;
    });

    let blob = new Blob([csv], { type: 'text/csv' });
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentUser + ".csv";
    a.click();
}

// INIT
loadUsers();
update();

</script>

</body>
</html>
